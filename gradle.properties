pluginGroup=ke.co.scedar.plugins
pluginName=FreeMarker Live Preview
pluginVersion=0.1.0

# IntelliJ Platform target. 2026.2 (branch 262) requires Java 25 bytecode compatibility.
pluginSinceBuild=262
platformVersion=2026.2.3

# Compile and run against a locally installed IDE instead of downloading the ~1.6 GB distribution.
# Remove (or point elsewhere) on machines without this installation; the build then downloads platformVersion.
platformLocalPath=/snap/intellij-idea/current

# JDK 25 used for the Java toolchain. The JetBrains Runtime bundled with the IDE is a full JDK.
# If this path does not exist, Gradle falls back to auto-provisioning a JDK 25 via the foojay resolver.
org.gradle.java.installations.paths=/snap/intellij-idea/current/jbr

org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
